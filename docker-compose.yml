services:
  inventoryservice:
    build:
      context: ./InventoryService   # folder containing InventoryService's Dockerfile
    ports:
      - "8080:8080"                 # host:container - same as your manual -p flag

  orderservice:
    build:
      context: ./OrderService       # folder containing OrderService's Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      - inventoryservice            # start-order only, not a readiness guarantee
    env_file:
      - .env                       # supplies ServiceBus__ConnectionString - never committed
    volumes:
      - orderflow-order-db:/app/data   # Day 9: named volume, NOT mounted at /app itself -
                                         # that would hide the published app binaries under
                                         # an empty volume. Only this data subfolder persists
                                         # independently of the container's own lifecycle.

  notificationservice:
    build:
      context: ./NotificationService
    ports:
      - "8082:8080"
    env_file:
      - .env                       # same Service Bus connection string, different subscription

volumes:
  orderflow-order-db:   # holds orderflow.db - survives 'down', rebuilds, and recreated containers
